# add desired CONFIGs here
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Kyle's Test Kit"
CONFIG_LOG=y

# Translate Bluetooth HCI error/reason codes into readable names (bt_hci_err_to_str)
CONFIG_BT_HCI_ERR_TO_STR=y

# Pill service: let phones send the 34-byte pill template.
# Bigger ATT MTU (65) so it fits in one write when the phone agrees to it...
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_L2CAP_TX_MTU=65
# ...and long (prepare) writes as a fallback for phones that stay at the default 23
CONFIG_BT_ATT_PREPARE_COUNT=4

#Motor control
CONFIG_SPI=y
CONFIG_PWM=y

# FOC does float math every loop: use the nRF52833's hardware FPU instead of slow software math,
# and save FPU registers between threads so the FOC thread's floats don't get corrupted
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
# lets LOG_INF print floats with %f
CONFIG_CBPRINTF_FP_SUPPORT=y

#Load Cell
CONFIG_ADC=y
